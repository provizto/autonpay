<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Restricted Jurisdiction | AutonPay</title>
  <style>
    body {
      background-color: #060a12;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background-color: #0b1222;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      max-width: 480px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    h1 {
      color: #f8fafc;
      font-size: 1.25rem;
      margin: 0 0 0.75rem 0;
    }
    p {
      font-size: 0.85rem;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">RESTRICTED JURISDICTION</div>
    <h1>Access Restricted</h1>
    <p>
      In accordance with international trade sanctions and regulatory compliance frameworks (including US OFAC regulations), access to the AutonPay interface is unavailable from your current jurisdiction.
    </p>
  </div>
</body>
</html>
