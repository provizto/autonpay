<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="autonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="16" fill="#070c18" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Orbit Nodes (M2M Network) -->
  <circle cx="32" cy="11" r="2.5" fill="#38bdf8" />
  <circle cx="13" cy="48" r="2.5" fill="#818cf8" />
  <circle cx="51" cy="48" r="2.5" fill="#34d399" />

